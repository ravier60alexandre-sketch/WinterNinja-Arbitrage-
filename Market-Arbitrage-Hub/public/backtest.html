<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIP3 Backtest</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .backtest-controls {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
      padding: 14px 16px; background: var(--bg-secondary); border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg); margin-bottom: 18px;
    }
    .backtest-controls label {
      display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); font-weight: 500;
    }
    .backtest-controls input, .backtest-controls select {
      background: var(--bg-input); border: 1px solid var(--border-secondary); color: var(--text-primary); padding: 6px 10px;
      border-radius: var(--radius-sm); font-family: 'JetBrains Mono', monospace; font-size: 13px; width: 100px;
      transition: border-color var(--transition-fast);
    }
    .backtest-controls input:focus, .backtest-controls select:focus {
      outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .backtest-controls button {
      background: var(--accent-blue); color: #fff; border: none; padding: 8px 20px;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all var(--transition-fast);
    }
    .backtest-controls button:hover { background: #2563eb; box-shadow: 0 0 12px rgba(59, 130, 246, 0.25); }
    .global-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 18px;
    }
    .global-stats .metric-card { text-align: center; }
    .pair-result {
      background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 14px;
    }
    .pair-result h3 {
      color: var(--accent-blue); margin: 0 0 12px 0; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pair-result h3 .pair-pnl { font-family: 'JetBrains Mono', monospace; }
    .pair-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px; margin-bottom: 10px;
    }
    .pair-stat {
      background: var(--bg-card); padding: 8px 10px; border-radius: var(--radius-sm); text-align: center;
      border: 1px solid var(--border-primary);
    }
    .pair-stat .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .pair-stat .stat-value { font-size: 14px; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); margin-top: 2px; }
    .scenario-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .scenario-table th { background: var(--bg-tertiary); padding: 8px 10px; text-align: center; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .scenario-table td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--border-primary); font-family: 'JetBrains Mono', monospace; }
    .trades-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; margin-top: 8px; }
    .trades-table th { background: var(--bg-tertiary); padding: 6px 8px; text-align: center; color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .trades-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--border-primary); font-family: 'JetBrains Mono', monospace; }
    .edge-dist { display: flex; gap: 6px; margin-bottom: 8px; }
    .edge-bar { flex: 1; background: var(--bg-card); padding: 6px 8px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--border-primary); }
    .edge-bar .bar-label { font-size: 9px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .edge-bar .bar-value { font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
    .loading { text-align: center; color: var(--text-muted); padding: 40px; font-size: 15px; font-weight: 500; }
    .nav-link { color: var(--accent-blue); text-decoration: none; font-size: 13px; font-weight: 500; transition: color var(--transition-fast); }
    .nav-link:hover { color: var(--accent-cyan); }
    .section-toggle {
      background: none; border: none; color: var(--accent-blue); cursor: pointer;
      font-size: 12px; padding: 2px 6px; font-weight: 500; transition: color var(--transition-fast);
    }
    .section-toggle:hover { color: var(--accent-cyan); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>HIP3 Backtest Analysis</h1>
      <a href="/" class="nav-link">&larr; Retour au monitoring</a>
    </header>

    <div class="backtest-controls">
      <label>
        Position ($)
        <input type="number" id="positionSize" value="50" min="10" step="10">
      </label>
      <label>
        Levier
        <input type="number" id="leverage" value="4" min="1" max="50">
      </label>
      <label>
        Latence (ms)
        <input type="number" id="latencyMs" value="150" min="10" step="10">
      </label>
      <label>
        Slippage latence (bps)
        <input type="number" id="latencySlippage" value="0.5" min="0" step="0.1">
      </label>
      <label>
        Seuil close (bps)
        <input type="number" id="closeThreshold" value="1.0" min="0" step="0.1">
      </label>
      <button id="runBacktest">Lancer le Backtest</button>
    </div>

    <div id="results">
      <div class="loading">Configure les paramètres et lance le backtest</div>
    </div>

    <div class="footer">
      HIP3 Backtest v1.0 — Données collectées en temps réel
    </div>
  </div>

  <script>
    function fmt(v, d) { return v !== null && v !== undefined ? Number(v).toFixed(d) : '--'; }
    function clr(v) { return v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral'; }

    document.getElementById('runBacktest').addEventListener('click', async () => {
      const params = new URLSearchParams({
        positionSize: document.getElementById('positionSize').value,
        leverage: document.getElementById('leverage').value,
        latencyMs: document.getElementById('latencyMs').value,
        latencySlippageBps: document.getElementById('latencySlippage').value,
        closeThreshold: document.getElementById('closeThreshold').value,
      });

      document.getElementById('results').innerHTML = '<div class="loading">Analyse en cours...</div>';

      try {
        const res = await fetch(`/backtest?${params}`);
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        document.getElementById('results').innerHTML = `<div class="loading">Erreur: ${e.message}</div>`;
      }
    });

    function renderResults(data) {
      const g = data.globalSummary;
      const c = data.config;

      let html = `
        <div class="section">
          <h2>Résumé Global</h2>
          <div class="global-stats">
            <div class="metric-card">
              <div class="label">Paires analysées</div>
              <div class="value neutral">${g.totalPairs}</div>
            </div>
            <div class="metric-card">
              <div class="label">Total trades</div>
              <div class="value neutral">${g.totalTrades}</div>
            </div>
            <div class="metric-card">
              <div class="label">Gagnants</div>
              <div class="value positive">${g.totalWins}</div>
            </div>
            <div class="metric-card">
              <div class="label">Perdants</div>
              <div class="value negative">${g.totalLosses}</div>
            </div>
            <div class="metric-card">
              <div class="label">Win Rate</div>
              <div class="value ${g.winRate >= 50 ? 'positive' : 'negative'}">${fmt(g.winRate, 1)}%</div>
            </div>
            <div class="metric-card">
              <div class="label">PnL Total ($)</div>
              <div class="value ${clr(g.totalNetPnlUsd)}">${g.totalNetPnlUsd >= 0 ? '+' : ''}$${fmt(g.totalNetPnlUsd, 4)}</div>
            </div>
            <div class="metric-card">
              <div class="label">Volume Total ($)</div>
              <div class="value neutral">$${g.totalVolumeUsd.toLocaleString()}</div>
            </div>
            <div class="metric-card">
              <div class="label">CPM ($/M)</div>
              <div class="value ${clr(g.cpmUsd)}">${g.cpmUsd >= 0 ? '+' : ''}$${fmt(g.cpmUsd, 2)}</div>
            </div>
          </div>
          <p style="color:#7a8ba3;font-size:12px;margin:4px 0;">
            Config: Position $${c.positionSizeUsd} x${c.leverage} | Marge $${fmt(c.marginPerTrade, 2)} | 
            Latence ${c.latencyMs}ms (${c.latencySlippageBps}bps) | Close à ${c.repegCloseThresholdBps}bps | 
            Fee RT: ${fmt(c.feeRoundTripBps, 2)}bps
          </p>
        </div>
      `;

      for (const pair of data.pairs) {
        const s = pair.summary;
        const pnlClass = clr(s.totalNetPnlUsd);
        const pnlSign = s.totalNetPnlUsd >= 0 ? '+' : '';

        html += `
          <div class="pair-result">
            <h3>
              <span>${pair.pairId}</span>
              <span class="pair-pnl ${pnlClass}">${pnlSign}$${fmt(s.totalNetPnlUsd, 4)} | Win ${fmt(s.winRate, 1)}%</span>
            </h3>
            <p style="color:#4a5a6a;font-size:11px;margin:0 0 8px 0;">
              ${pair.dataRange.firstSignal ? new Date(pair.dataRange.firstSignal).toLocaleString() : '--'} → 
              ${pair.dataRange.lastSignal ? new Date(pair.dataRange.lastSignal).toLocaleString() : '--'} 
              (${fmt(pair.dataRange.durationHours, 1)}h)
            </p>
            <div class="pair-stats">
              <div class="pair-stat">
                <div class="stat-label">Trades</div>
                <div class="stat-value">${s.totalSpikes}</div>
              </div>
              <div class="pair-stat">
                <div class="stat-label">Win/Loss</div>
                <div class="stat-value">${s.profitableTrades}/${s.unprofitableTrades}</div>
              </div>
              <div class="pair-stat">
                <div class="stat-label">Avg PnL (bps)</div>
                <div class="stat-value ${clr(s.avgPnlBps)}">${fmt(s.avgPnlBps, 2)}</div>
              </div>
              <div class="pair-stat">
                <div class="stat-label">Trades/h</div>
                <div class="stat-value">${fmt(s.tradesPerHour, 1)}</div>
              </div>
              <div class="pair-stat">
                <div class="stat-label">PnL/h ($)</div>
                <div class="stat-value ${clr(s.pnlPerHourUsd)}">${fmt(s.pnlPerHourUsd, 4)}</div>
              </div>
              <div class="pair-stat">
                <div class="stat-label">CPM ($/M)</div>
                <div class="stat-value ${clr(s.cpmUsd)}">${fmt(s.cpmUsd, 2)}</div>
              </div>
            </div>
        `;

        if (pair.edgeDistribution) {
          const ed = pair.edgeDistribution;
          html += `
            <div class="edge-dist">
              <div class="edge-bar"><div class="bar-label">&lt;3bps</div><div class="bar-value">${ed.below3bps}</div></div>
              <div class="edge-bar"><div class="bar-label">3-5bps</div><div class="bar-value">${ed['3to5bps']}</div></div>
              <div class="edge-bar"><div class="bar-label">5-8bps</div><div class="bar-value">${ed['5to8bps']}</div></div>
              <div class="edge-bar"><div class="bar-label">8-12bps</div><div class="bar-value">${ed['8to12bps']}</div></div>
              <div class="edge-bar"><div class="bar-label">&gt;12bps</div><div class="bar-value">${ed.above12bps}</div></div>
            </div>
          `;
        }

        if (pair.latencyScenarios) {
          html += `
            <table class="scenario-table">
              <thead><tr>
                <th>Latence</th><th>Slippage</th><th>Wins</th><th>Losses</th><th>Win Rate</th><th>PnL (bps)</th><th>PnL ($)</th>
              </tr></thead>
              <tbody>
          `;
          for (const sc of pair.latencyScenarios) {
            html += `<tr>
              <td>${sc.latencyMs}ms</td>
              <td>${sc.latencySlippageBps}bps</td>
              <td class="positive">${sc.wins}</td>
              <td class="negative">${sc.losses}</td>
              <td class="${sc.winRate >= 50 ? 'positive' : 'negative'}">${fmt(sc.winRate, 1)}%</td>
              <td class="${clr(sc.totalPnlBps)}">${fmt(sc.totalPnlBps, 2)}</td>
              <td class="${clr(sc.totalPnlUsd)}">${sc.totalPnlUsd >= 0 ? '+' : ''}$${fmt(sc.totalPnlUsd, 4)}</td>
            </tr>`;
          }
          html += `</tbody></table>`;
        }

        if (pair.trades && pair.trades.length > 0) {
          html += `
            <button class="section-toggle" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
              Voir les trades (${pair.trades.length})
            </button>
            <div style="display:none;">
              <table class="trades-table">
                <thead><tr>
                  <th>Time</th><th>Dir</th><th>Edge (bps)</th><th>Fees RT</th><th>Slip E+X</th><th>Close</th><th>PnL (bps)</th><th>PnL $</th><th>ROI %</th><th>Spike ms</th>
                </tr></thead>
                <tbody>
          `;
          for (const t of pair.trades) {
            const totalSlip = (t.entrySlippageBps || 0) + (t.exitSlippageBps || 0);
            html += `<tr class="${t.profitable ? 'opportunity' : ''}">
              <td>${new Date(t.ts).toLocaleTimeString()}</td>
              <td>${t.direction === 1 ? 'D1' : 'D2'}</td>
              <td>${fmt(t.entryGrossEdgeBps, 2)}</td>
              <td>${fmt(t.feeRoundTripBps, 2)}</td>
              <td>${fmt(totalSlip, 2)}</td>
              <td>${fmt(t.repegCloseThresholdBps, 2)}</td>
              <td class="${clr(t.finalPnlBps)}">${fmt(t.finalPnlBps, 2)}</td>
              <td class="${clr(t.pnlUsd)}">${t.pnlUsd >= 0 ? '+' : ''}$${fmt(t.pnlUsd, 4)}</td>
              <td class="${clr(t.roiPct)}">${fmt(t.roiPct, 2)}%</td>
              <td>${t.spikeDurationMs}</td>
            </tr>`;
          }
          html += `</tbody></table></div>`;
        }

        html += `</div>`;
      }

      document.getElementById('results').innerHTML = html;
    }
  </script>
</body>
</html>
